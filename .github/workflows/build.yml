name: Build JCoz

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11', '17', '21', '23' ]
        os: [ 'ubuntu-latest', 'macos-latest', 'windows-latest' ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        cache: maven
        distribution: ${{ ( matrix.os == 'macos-latest' && matrix.java == '8' ) && 'zulu' || 'temurin' }}
        java-version: ${{ matrix.java }}
    - if: ${{ matrix.os == 'ubuntu-latest' }}
      run: sudo apt-get install libspdlog-dev
    - if: ${{ matrix.os == 'macos-latest' }}
      run: brew install spdlog
    - if: ${{ matrix.os == 'windows-latest' }}
      run: vcpkg install spdlog
    - run: make clean
    - run: make all